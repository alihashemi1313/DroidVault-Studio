name: Build & Release Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: DroidVault-Studio-Windows-x64.zip
            build_script: |
              export SCRCPY_VERSION="4.1"
              curl --fail --location --retry 3 \
                "https://github.com/Genymobile/scrcpy/releases/download/v${SCRCPY_VERSION}/scrcpy-win64-v${SCRCPY_VERSION}.zip" \
                -o scrcpy-windows.zip

              mkdir -p tools/windows
              unzip -q scrcpy-windows.zip -d tools/windows

              # flatten nested extracted dir if present
              nested_dir="$(find tools/windows -mindepth 1 -maxdepth 1 -type d -print -quit || true)"
              if [ -n "$nested_dir" ]; then
                cp -R "$nested_dir"/. tools/windows/
                rm -rf "$nested_dir"
              fi

              test -f tools/windows/adb.exe
              test -f tools/windows/scrcpy.exe

              # accept v4.1 server naming
              find tools/windows -maxdepth 1 -type f -name 'scrcpy-server*'

              pip install pyinstaller pillow customtkinter
              pyinstaller --clean DroidVault-Studio.spec

              # Validate the files included by the spec directly.
              test -f tools/windows/adb.exe
              test -f tools/windows/scrcpy.exe

              scrcpy_server="$(find tools/windows -maxdepth 1 -type f -iname 'scrcpy-server*' -print -quit)"
              test -n "$scrcpy_server" || {
                echo "scrcpy server was not found"
                find tools/windows -maxdepth 1 -type f -print
                exit 1
              }

              mkdir -p bundle
              mv dist/DroidVault-Studio.exe bundle/
              cp -R tools bundle/
              cp README.md bundle/
              cp LICENSE bundle/
              powershell -Command "Compress-Archive -Path 'bundle/*' -DestinationPath 'DroidVault-Studio-Windows-x64.zip'"

          - os: ubuntu-latest
            artifact_name: DroidVault-Studio-Linux-x64.tar.gz
            build_script: |
              sudo apt-get update && sudo apt-get install -y python3-tk binutils curl unzip
              export SCRCPY_VERSION="4.1"
              mkdir -p tools/linux

              curl --fail --location --retry 3 "https://dl.google.com/android/repository/platform-tools-latest-linux.zip" -o /tmp/platform-tools.zip
              unzip -q /tmp/platform-tools.zip -d /tmp
              cp -R /tmp/platform-tools/. tools/linux/

              curl --fail --location --retry 3 \
                "https://github.com/Genymobile/scrcpy/releases/download/v${SCRCPY_VERSION}/scrcpy-linux-x86_64-v${SCRCPY_VERSION}.tar.gz" \
                -o /tmp/scrcpy.tar.gz
              tar -xzf /tmp/scrcpy.tar.gz -C /tmp
              cp -R "/tmp/scrcpy-linux-x86_64-v${SCRCPY_VERSION}/." tools/linux/

              chmod +x tools/linux/adb tools/linux/scrcpy
              pip install pyinstaller pillow customtkinter
              
              pyinstaller --clean DroidVault-Studio.spec

              test -f tools/linux/adb
              test -f tools/linux/scrcpy
              scrcpy_server="$(find tools/linux -maxdepth 1 -type f -iname 'scrcpy-server*' -print -quit)"
              test -n "$scrcpy_server" || {
                echo "scrcpy server was not found"
                find tools/linux -maxdepth 1 -type f -print
                exit 1
              }

              test -x tools/linux/adb
              test -x tools/linux/scrcpy
              mkdir -p bundle
              chmod +x dist/DroidVault-Studio
              cp dist/DroidVault-Studio bundle/
              cp -R tools bundle/
              cp README.md bundle/
              cp LICENSE bundle/
              tar -czvf DroidVault-Studio-Linux-x64.tar.gz -C bundle .

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile Standalone Executable
        shell: bash
        run: ${{ matrix.build_script }}

      - name: Compute SHA-256 Checksum
        shell: bash
        run: |
          sha256sum ${{ matrix.artifact_name }} > ${{ matrix.artifact_name }}.sha256

      - name: Upload Artifact to Workflow
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            ${{ matrix.artifact_name }}
            ${{ matrix.artifact_name }}.sha256

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download All Built Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets
          merge-multiple: true

      - name: Combine Checksums
        run: |
          cd release_assets
          cat *.sha256 > SHA256SUMS.txt
          rm -f *.sha256
          ls -la

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            release_assets/*
          draft: false
          prerelease: false
          generate_release_notes: true
