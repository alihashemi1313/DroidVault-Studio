name: Build & Release Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: DroidVault-Studio-Windows-x64.zip
            build_script: |
              export SCRCPY_VERSION="4.1"
              curl --fail --location --retry 3 \
                "https://github.com/Genymobile/scrcpy/releases/download/v${SCRCPY_VERSION}/scrcpy-win64-v${SCRCPY_VERSION}.zip" \
                -o scrcpy-windows.zip
              scrcpy_windows_sha256="${SCRCPY_WINDOWS_SHA256:-5b12172b3264b2889f4583ee64752ce832e29bc8b1089dca81093459697165db}"
              echo "${scrcpy_windows_sha256}  scrcpy-windows.zip" | sha256sum --check --strict

              mkdir -p tools/windows
              unzip -q scrcpy-windows.zip -d tools/windows

              # flatten nested extracted dir if present
              nested_dir="$(find tools/windows -mindepth 1 -maxdepth 1 -type d -print -quit || true)"
              if [ -n "$nested_dir" ]; then
                cp -R "$nested_dir"/. tools/windows/
                rm -rf "$nested_dir"
              fi

              test -f tools/windows/adb.exe
              test -f tools/windows/scrcpy.exe

              # accept v4.1 server naming
              find tools/windows -maxdepth 1 -type f -name 'scrcpy-server*'

              pip install pyinstaller pillow customtkinter
              pyinstaller --clean DroidVault-Studio.spec

              # Validate the files included by the spec directly.
              test -f tools/windows/adb.exe
              test -f tools/windows/scrcpy.exe

              scrcpy_server="$(find tools/windows -maxdepth 1 -type f -iname 'scrcpy-server*' -print -quit)"
              test -n "$scrcpy_server" || {
                echo "scrcpy server was not found"
                find tools/windows -maxdepth 1 -type f -print
                exit 1
              }

              if [ "${WINDOWS_SIGNING_ENABLED:-false}" = "true" ]; then
                test -n "${WINDOWS_SIGNING_CERTIFICATE:-}" || {
                  echo "::error::Windows signing certificate is missing"
                  exit 1
                }
                test -n "${WINDOWS_SIGNING_CERTIFICATE_PASSWORD:-}" || {
                  echo "::error::Windows signing certificate password is missing"
                  exit 1
                }
                printf '%s' "$WINDOWS_SIGNING_CERTIFICATE" | base64 --decode > signing-cert.pfx
                signtool="$(find '/c/Program Files (x86)/Windows Kits' -type f -name signtool.exe -print -quit 2>/dev/null || true)"
                test -n "$signtool" || {
                  echo "::error::signtool.exe is unavailable"
                  exit 1
                }
                export SIGNTOOL_PATH="$signtool"
                powershell -NoProfile -Command '& $env:SIGNTOOL_PATH sign /fd SHA256 /f signing-cert.pfx /p $env:WINDOWS_SIGNING_CERTIFICATE_PASSWORD /tr http://timestamp.digicert.com /td SHA256 dist/DroidVault-Studio.exe'
                powershell -NoProfile -Command '& $env:SIGNTOOL_PATH verify /pa /all dist/DroidVault-Studio.exe'
              else
                echo "::warning::Windows executable is unsigned; configure WINDOWS_SIGNING_ENABLED and certificate secrets for production releases"
              fi

              mkdir -p bundle
              mv dist/DroidVault-Studio.exe bundle/
              cp -R tools bundle/
              cp README.md bundle/
              cp LICENSE bundle/
              powershell -Command "Compress-Archive -Path 'bundle/*' -DestinationPath 'DroidVault-Studio-Windows-x64.zip'"
              unzip -Z1 DroidVault-Studio-Windows-x64.zip | grep -Fx 'tools/windows/adb.exe'
              unzip -Z1 DroidVault-Studio-Windows-x64.zip | grep -Fx 'tools/windows/scrcpy.exe'
              unzip -Z1 DroidVault-Studio-Windows-x64.zip | grep -E '^tools/windows/scrcpy-server[^/]*$'
              ! unzip -Z1 DroidVault-Studio-Windows-x64.zip | grep -E 'tools/windows/tools/windows|tools/windows/scrcpy-win64'

          - os: ubuntu-latest
            artifact_name: DroidVault-Studio-Linux-x64.tar.gz
            build_script: |
              sudo apt-get update && sudo apt-get install -y python3-tk binutils curl unzip
              export SCRCPY_VERSION="4.1"
              mkdir -p tools/linux

              curl --fail --location --retry 3 "https://dl.google.com/android/repository/platform-tools-latest-linux.zip" -o platform-tools.zip
              platform_tools_sha256="$(sha256sum platform-tools.zip | cut -d ' ' -f 1)"
              test -n "$platform_tools_sha256"
              echo "Downloaded platform-tools SHA-256: $platform_tools_sha256"
              unzip -q platform-tools.zip -d platform-tools-extracted
              cp -R platform-tools-extracted/platform-tools/. tools/linux/

              curl --fail --location --retry 3 \
                "https://github.com/Genymobile/scrcpy/releases/download/v${SCRCPY_VERSION}/scrcpy-linux-x86_64-v${SCRCPY_VERSION}.tar.gz" \
                -o scrcpy-linux.tar.gz
              scrcpy_linux_sha256="${SCRCPY_LINUX_SHA256:-ad56ae8bfeedf41e824945c11dbf55fcb092b3e615b9b486f48a50e30d389635}"
              echo "${scrcpy_linux_sha256}  scrcpy-linux.tar.gz" | sha256sum --check --strict
              tar -xzf scrcpy-linux.tar.gz
              cp -R "scrcpy-linux-x86_64-v${SCRCPY_VERSION}/." tools/linux/

              chmod +x tools/linux/adb tools/linux/scrcpy
              pip install pyinstaller pillow customtkinter
              
              pyinstaller --clean DroidVault-Studio.spec

              test -f tools/linux/adb
              test -f tools/linux/scrcpy
              scrcpy_server="$(find tools/linux -maxdepth 1 -type f -iname 'scrcpy-server*' -print -quit)"
              test -n "$scrcpy_server" || {
                echo "scrcpy server was not found"
                find tools/linux -maxdepth 1 -type f -print
                exit 1
              }

              test -x tools/linux/adb
              test -x tools/linux/scrcpy
              mkdir -p bundle
              chmod +x dist/DroidVault-Studio
              cp dist/DroidVault-Studio bundle/
              cp -R tools bundle/
              cp README.md bundle/
              cp LICENSE bundle/
              tar -czvf DroidVault-Studio-Linux-x64.tar.gz -C bundle .
              tar -tzf DroidVault-Studio-Linux-x64.tar.gz | grep -Fx './tools/linux/adb'
              tar -tzf DroidVault-Studio-Linux-x64.tar.gz | grep -Fx './tools/linux/scrcpy'
              tar -tzf DroidVault-Studio-Linux-x64.tar.gz | grep -E '^\./tools/linux/scrcpy-server[^/]*$'
              ! tar -tzf DroidVault-Studio-Linux-x64.tar.gz | grep -E 'tools/linux/tools/linux|tools/linux/scrcpy-linux'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile Standalone Executable
        shell: bash
        env:
          SCRCPY_WINDOWS_SHA256: ${{ vars.SCRCPY_WINDOWS_SHA256 }}
          SCRCPY_LINUX_SHA256: ${{ vars.SCRCPY_LINUX_SHA256 }}
          WINDOWS_SIGNING_ENABLED: ${{ vars.WINDOWS_SIGNING_ENABLED }}
          WINDOWS_SIGNING_CERTIFICATE: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE }}
          WINDOWS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
        run: ${{ matrix.build_script }}

      - name: Compute SHA-256 Checksum
        shell: bash
        run: |
          sha256sum ${{ matrix.artifact_name }} > ${{ matrix.artifact_name }}.sha256

      - name: Upload Artifact to Workflow
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            ${{ matrix.artifact_name }}
            ${{ matrix.artifact_name }}.sha256

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download All Built Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets
          merge-multiple: true

      - name: Combine Checksums
        run: |
          cd release_assets
          test -f DroidVault-Studio-Windows-x64.zip
          test -f DroidVault-Studio-Linux-x64.tar.gz
          cat *.sha256 > SHA256SUMS.txt
          sha256sum --check --strict SHA256SUMS.txt
          rm -f *.sha256
          test -s SHA256SUMS.txt
          find . -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            release_assets/*
          draft: false
          prerelease: false
          generate_release_notes: true
