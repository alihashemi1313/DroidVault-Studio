name: Build & Release Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: DroidVault-Studio-Windows-x64.zip
            build_script: |
              pip install pyinstaller pillow customtkinter
              pyinstaller --noconsole --onefile --icon="app_icon.ico" --add-data "app_icon.png;." --add-data "app_icon.ico;." --collect-all customtkinter --collect-all PIL main.py --name "DroidVault-Studio"
              mkdir bundle
              move dist\DroidVault-Studio.exe bundle\
              copy README.md bundle\
              copy LICENSE bundle\
              powershell Compress-Archive -Path bundle\* -DestinationPath DroidVault-Studio-Windows-x64.zip

          - os: ubuntu-latest
            artifact_name: DroidVault-Studio-Linux-x64.tar.gz
            build_script: |
              sudo apt-get update && sudo apt-get install -y python3-tk binutils
              pip install pyinstaller pillow customtkinter
              pyinstaller --noconsole --onefile --add-data "app_icon.png:." --collect-all customtkinter --collect-all PIL --hidden-import "PIL._tkinter_finder" main.py --name "DroidVault-Studio"
              mkdir bundle
              chmod +x dist/DroidVault-Studio
              cp dist/DroidVault-Studio bundle/
              cp README.md bundle/
              cp LICENSE bundle/
              tar -czvf DroidVault-Studio-Linux-x64.tar.gz -C bundle .

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile Standalone Executable
        shell: bash
        run: ${{ matrix.build_script }}

      - name: Compute SHA-256 Checksum
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            certutil -hashfile ${{ matrix.artifact_name }} SHA256 | findstr /v ":" > ${{ matrix.artifact_name }}.sha256
          else
            sha256sum ${{ matrix.artifact_name }} > ${{ matrix.artifact_name }}.sha256
          fi

      - name: Upload Artifact to Workflow
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            ${{ matrix.artifact_name }}
            ${{ matrix.artifact_name }}.sha256

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download All Built Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets
          merge-multiple: true

      - name: Combine Checksums
        run: |
          cd release_assets
          cat *.sha256 > SHA256SUMS.txt
          rm -f *.sha256
          ls -la

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            release_assets/*
          draft: false
          prerelease: false
          generate_release_notes: true
